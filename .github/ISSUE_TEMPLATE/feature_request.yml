name: Feature request
description: Suggest an improvement for CorePay Money for WooCommerce
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Tell us what would make the plugin more useful for merchants or operators.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      placeholder: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
